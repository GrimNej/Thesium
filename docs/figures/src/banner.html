<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  #figure { height: 600px; padding: 0; background: var(--ink) url('frames/fog.jpg') center / cover; }
  #figure::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,7,12,0.92) 0%, rgba(5,7,12,0.70) 42%, rgba(5,7,12,0.15) 75%, rgba(5,7,12,0.35) 100%); }
  .left { position: absolute; left: 80px; top: 104px; width: 860px; z-index: 2; }
  .word { font: 900 122px/0.9 var(--display); letter-spacing: 0.01em; margin: 26px 0 0; text-shadow: 0 0 40px rgba(200, 235, 255, 0.22); }
  .tag { font: 600 40px/1.15 var(--sans); margin: 30px 0 0; letter-spacing: -0.01em; }
  .tag span { color: var(--cyan); }
  .chips { display: flex; gap: 10px; margin-top: 40px; }
  .chips .chip { font-size: 18px; padding: 8px 14px 8px 10px; gap: 8px; }
  .chips .logo, .chips .mask { width: 22px; height: 22px; }
  .stage { position: absolute; right: -60px; top: 112px; width: 820px; height: 470px; perspective: 1500px; z-index: 1; }
  .strip { position: absolute; inset: 0; transform: rotateY(-24deg) rotateX(7deg) translateZ(-40px); transform-style: preserve-3d; }
  .frame { position: absolute; width: 400px; height: 225px; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.08); }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ruler { position: absolute; left: 30px; right: 10px; top: -36px; height: 2px; background: rgba(111,231,242,0.55); }
  .tick { position: absolute; top: -8px; width: 2px; height: 10px; background: rgba(111,231,242,0.55); }
  .tick b { position: absolute; top: -26px; left: -14px; font: 500 15px/1 var(--mono); color: var(--steel); white-space: nowrap; }
  .playhead { position: absolute; left: 470px; top: -48px; bottom: -40px; width: 3px; background: var(--cyan); box-shadow: 0 0 18px var(--cyan), 0 0 4px var(--cyan); }
  .readout { position: absolute; left: 482px; top: -80px; font: 600 20px/1 var(--mono); color: var(--ink); background: var(--cyan); padding: 6px 10px; border-radius: 6px; }
</style>
</head>
<body>
<div id="figure">
  <div class="stage"><div class="strip">
    <div class="ruler">
      <div class="tick" style="left: 0"><b>0 s</b></div><div class="tick" style="left: 190px"><b>5 s</b></div>
      <div class="tick" style="left: 380px"><b>10 s</b></div><div class="tick" style="left: 570px"></div>
      <div class="tick" style="left: 760px"><b>20 s</b></div>
    </div>
    <div class="frame" style="left: 30px; top: 0"><img src="frames/same.jpg"></div>
    <div class="frame" style="left: 450px; top: 0"><img src="frames/wall.jpg"></div>
    <div class="frame" style="left: 30px; top: 245px"><img src="frames/phonemes.jpg"></div>
    <div class="frame" style="left: 450px; top: 245px"><img src="frames/lanes.jpg"></div>
    <div class="playhead"></div>
    <div class="readout">t = 12.40</div>
  </div></div>
  <div class="left">
    <div class="eyebrow">A motion studio for frontier models</div>
    <div class="word">THESIUM</div>
    <div class="tag">The model directs.<br><span>Any engine renders.</span></div>
    <div class="chips">
      <span class="chip"><span class="mask" style="--m: url('logos/googlechrome.svg'); --c: #8ab4f8"></span>Web</span>
      <span class="chip"><img class="logo" src="logos/effectcraft.png" style="border-radius: 6px">EffectCraft</span>
      <span class="chip"><img class="logo" src="logos/remotion.png">Remotion</span>
      <span class="chip"><img class="logo" src="logos/hyperframes.png">HyperFrames</span>
      <span class="chip"><span class="mono cyan" style="font-size: 20px">&gt;_</span>Any CLI</span>
    </div>
  </div>
</div>
</body>
</html>
